name: cincel-app Build

on:
  pull_request:
    paths:
      - "cincel-app/**"
      - ".github/workflows/cincel-app-build.yml"
      - ".github/scripts/next-version.sh"
  push:
    branches:
      - main
    paths:
      - "cincel-app/**"
      - ".github/workflows/cincel-app-build.yml"
      - ".github/scripts/next-version.sh"
  workflow_dispatch:

defaults:
  run:
    working-directory: cincel-app

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  unit-tests:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  e2e-tests:
    needs: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cincel
          POSTGRES_USER: cincel
          POSTGRES_PASSWORD: cincel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cincel -d cincel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cincel:cincel@localhost:5432/cincel
      SEED_ADMIN_EMAIL: paul@cincel.mx
      SEED_ADMIN_PASSWORD: CincelAdmin2026!
      E2E_ADMIN_PASSWORD: CincelAdmin2026!

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: cincel-app/playwright-report/
          retention-days: 7

  docker-build:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cincel-app:ci .

  # Builds and publishes two image tags from the same Dockerfile on every push
  # to main: the runtime image (`cincel-app`, final stage) and the migrate
  # image (`cincel-app-migrate`, the `build` stage — still has drizzle-kit +
  # tsx + the migration SQL, which the runtime stage deliberately drops). This
  # mirrors why docker-compose.yml's local `migrate` service points at the
  # Dockerfile's `build` target instead of the runtime target — see that
  # file's comment. docker-compose.prod.yml pulls both.
  #
  # Publishes to this team's own registry (REGISTRY_URL) on the self-hosted
  # runner, using the REGISTRY_USERNAME/REGISTRY_PASSWORD repo secrets.
  #
  # Once both images are pushed, cuts a GitHub release tagged
  # cincel-app-vX.Y.Z, versioned from the Conventional Commits since the
  # previous one (.github/scripts/next-version.sh). The same version is baked
  # into the image (shown in the sidebar) and added as an image tag. Releases
  # are serialized so two quick merges can't compute the same version.
  docker-publish:
    needs: [verify, unit-tests, e2e-tests, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency:
      group: cincel-app-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # Full history and tags: the version is computed from the commits
          # since the last cincel-app-v* tag.
          fetch-depth: 0

      # Fails with the name of the missing secret instead of docker/login-action's
      # opaque "Username and password required".
      - name: Check registry secrets
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        working-directory: .
        run: |
          missing=0
          for name in REGISTRY_URL REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing

      - name: Compute release version
        id: version
        working-directory: .
        run: |
          .github/scripts/next-version.sh cincel-app "$RUNNER_TEMP/release-notes.md" \
            .github/workflows/cincel-app-build.yml .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"

      # Strips a trailing slash and an accidental http(s):// scheme from the
      # REGISTRY_URL secret before it's used to build an image reference --
      # `docker login` tolerates both, but `docker/build-push-action` doesn't:
      # a trailing slash produces a double slash in the tag ("host//cincel-app")
      # and fails with "invalid reference format".
      - name: Normalize registry URL
        id: registry
        run: |
          registry="${{ secrets.REGISTRY_URL }}"
          registry="${registry%/}"
          registry="${registry#http://}"
          registry="${registry#https://}"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: cincel-app
          file: cincel-app/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.registry.outputs.registry }}/cincel-app:${{ steps.version.outputs.version }}
            ${{ steps.registry.outputs.registry }}/cincel-app:${{ github.sha }}
            ${{ steps.registry.outputs.registry }}/cincel-app:latest
          cache-from: type=gha,scope=cincel-app-runtime
          cache-to: type=gha,mode=max,scope=cincel-app-runtime

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: cincel-app
          file: cincel-app/Dockerfile
          target: build
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.registry.outputs.registry }}/cincel-app-migrate:${{ steps.version.outputs.version }}
            ${{ steps.registry.outputs.registry }}/cincel-app-migrate:${{ github.sha }}
            ${{ steps.registry.outputs.registry }}/cincel-app-migrate:latest
          cache-from: type=gha,scope=cincel-app-migrate
          cache-to: type=gha,mode=max,scope=cincel-app-migrate

      # Only reached once both images are pushed. Skipped when nothing under
      # cincel-app/ (or this pipeline) changed since the last release.
      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: cincel-app v${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: true
