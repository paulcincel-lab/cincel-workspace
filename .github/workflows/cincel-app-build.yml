name: cincel-app Build

on:
  pull_request:
    paths:
      - "cincel-app/**"
      - ".github/workflows/cincel-app-build.yml"
  push:
    branches:
      - main
    paths:
      - "cincel-app/**"
      - ".github/workflows/cincel-app-build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: cincel-app

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  unit-tests:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  e2e-tests:
    needs: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cincel
          POSTGRES_USER: cincel
          POSTGRES_PASSWORD: cincel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cincel -d cincel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cincel:cincel@localhost:5432/cincel
      SEED_ADMIN_EMAIL: paul@cincel.mx
      SEED_ADMIN_PASSWORD: CincelAdmin2026!
      E2E_ADMIN_PASSWORD: CincelAdmin2026!

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: cincel-app/playwright-report/
          retention-days: 7

  docker-build:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cincel-app:ci .
