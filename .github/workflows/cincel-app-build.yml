name: cincel-app Build

on:
  pull_request:
    paths:
      - "cincel-app/**"
      - ".github/workflows/cincel-app-build.yml"
  push:
    branches:
      - main
    paths:
      - "cincel-app/**"
      - ".github/workflows/cincel-app-build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: cincel-app

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  unit-tests:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  e2e-tests:
    needs: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cincel
          POSTGRES_USER: cincel
          POSTGRES_PASSWORD: cincel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cincel -d cincel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cincel:cincel@localhost:5432/cincel
      SEED_ADMIN_EMAIL: paul@cincel.mx
      SEED_ADMIN_PASSWORD: CincelAdmin2026!
      E2E_ADMIN_PASSWORD: CincelAdmin2026!

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: cincel-app/playwright-report/
          retention-days: 7

  docker-build:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cincel-app:ci .

  # Builds and publishes two image tags from the same Dockerfile on every push
  # to main: the runtime image (`cincel-app`, final stage) and the migrate
  # image (`cincel-app-migrate`, the `build` stage — still has drizzle-kit +
  # tsx + the migration SQL, which the runtime stage deliberately drops). This
  # mirrors why docker-compose.yml's local `migrate` service points at the
  # Dockerfile's `build` target instead of the runtime target — see that
  # file's comment. docker-compose.prod.yml pulls both.
  #
  # Publishes to this team's own registry (REGISTRY_URL) on the self-hosted
  # runner, using the REGISTRY_USERNAME/REGISTRY_PASSWORD repo secrets.
  docker-publish:
    needs: [verify, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read

    env:
      REGISTRY: ${{ secrets.REGISTRY_URL }}
      IMAGE_APP: ${{ secrets.REGISTRY_URL }}/cincel-app
      IMAGE_MIGRATE: ${{ secrets.REGISTRY_URL }}/cincel-app-migrate

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: cincel-app
          file: cincel-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ github.sha }}
            ${{ env.IMAGE_APP }}:latest
          cache-from: type=gha,scope=cincel-app-runtime
          cache-to: type=gha,mode=max,scope=cincel-app-runtime

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: cincel-app
          file: cincel-app/Dockerfile
          target: build
          push: true
          tags: |
            ${{ env.IMAGE_MIGRATE }}:${{ github.sha }}
            ${{ env.IMAGE_MIGRATE }}:latest
          cache-from: type=gha,scope=cincel-app-migrate
          cache-to: type=gha,mode=max,scope=cincel-app-migrate

  # Manual only: apply Drizzle migrations to a remote/managed database (one that
  # is not part of the docker-compose stack — for compose deploys the `migrate`
  # service handles this automatically on `up`). Run via the Actions tab →
  # "Run workflow". Requires the `production` environment to define a
  # `PROD_DATABASE_URL` secret.
  migrate-remote-db:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
