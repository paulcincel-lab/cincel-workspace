name: cincel-app CI

# Checks for pull requests: lint + build (with a clean build log) and unit tests. Playwright e2e runs
# locally (npm run test:e2e), not on the runners.
# Images are built and published by cincel-app-docker.yml on push to main.
on:
  pull_request:
    paths:
      - "cincel-app/**"
      - ".github/workflows/cincel-app-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: cincel-app

jobs:
  verify:
    runs-on: self-hosted

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The build must never reach a database: DATABASE_URL points at a closed
      # local port, so any read during prerender logs ECONNREFUSED. The log is
      # then checked for errors, DB connections and deprecations (#930);
      # accepted notices live in scripts/build-log-allowlist.json.
      - name: Build
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:9/build_unreachable
        run: |
          set -o pipefail
          npm run build 2>&1 | tee next-build.log

      - name: Check the build log
        run: node scripts/check-build-log.mjs next-build.log

  unit-tests:
    needs: verify
    runs-on: self-hosted

    # No containers are created for tests. The database tests (*.db.test.ts,
    # tests/db) run only when the repository variable TEST_DATABASE_URL points
    # at a long-lived test database; otherwise they skip and the rest still run.
    env:
      TEST_DATABASE_URL: ${{ vars.TEST_DATABASE_URL }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations to the test database
        if: env.TEST_DATABASE_URL != ''
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run unit tests
        run: npm run test:unit
