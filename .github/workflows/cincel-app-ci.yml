name: cincel-app CI

# Checks for pull requests: typecheck/lint, unit tests and e2e tests.
# Images are built and published by cincel-app-docker.yml on push to main.
on:
  pull_request:
    paths:
      - "cincel-app/**"
      - ".github/workflows/cincel-app-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: cincel-app

jobs:
  verify:
    runs-on: self-hosted

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  unit-tests:
    needs: verify
    runs-on: self-hosted

    # A migrated Postgres for the tests that read TEST_DATABASE_URL (each
    # runs in a rolled-back transaction); no app server or seed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cincel_test
          POSTGRES_USER: cincel
          POSTGRES_PASSWORD: cincel
        ports:
          # Random host port: jobs share self-hosted machines.
          - 5432
        options: >-
          --health-cmd "pg_isready -U cincel -d cincel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://cincel:cincel@localhost:${{ job.services.postgres.ports['5432'] }}/cincel_test

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run unit tests
        run: npm run test:unit

  e2e-tests:
    needs: verify
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cincel
          POSTGRES_USER: cincel
          POSTGRES_PASSWORD: cincel
        ports:
          # Random host port: jobs share self-hosted machines.
          - 5432
        options: >-
          --health-cmd "pg_isready -U cincel -d cincel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cincel:cincel@localhost:${{ job.services.postgres.ports['5432'] }}/cincel
      SEED_ADMIN_EMAIL: paul@cincel.mx
      # Throwaway value for the CI database only; no deployed instance uses it.
      SEED_ADMIN_PASSWORD: ci-e2e-admin-password
      E2E_ADMIN_PASSWORD: ci-e2e-admin-password
      # Throwaway value: the web server and mi-espacio.spec.ts both read it to fire reminders via /api/cron/tick.
      CRON_SECRET: ci-e2e-cron-secret

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cincel-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      # Self-hosted machines run other apps: pick a free port for this run's app server.
      - name: Pick a free port for the app server
        run: echo "E2E_PORT=$(node -e "const s=require('net').createServer().listen(0,()=>{console.log(s.address().port);s.close()})")" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: cincel-app/playwright-report/
          retention-days: 7
