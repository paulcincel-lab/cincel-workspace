name: cincel-app Docker

# Builds and pushes the cincel-app images on every push to main, then cuts a
# release. Pull-request checks live in cincel-app-ci.yml.
on:
  push:
    branches:
      - main
    paths:
      - "cincel-app/**"
      - ".github/workflows/cincel-app-docker.yml"
      - ".github/scripts/next-version.sh"
  workflow_dispatch:

defaults:
  run:
    working-directory: cincel-app

jobs:
  # Builds and publishes two image tags from the same Dockerfile on every push
  # to main: the runtime image (`cincel-app`, final stage) and the migrate
  # image (`cincel-app-migrate`, the `build` stage — still has drizzle-kit +
  # tsx + the migration SQL, which the runtime stage deliberately drops). This
  # mirrors why docker-compose.yml's local `migrate` service points at the
  # Dockerfile's `build` target instead of the runtime target — see that
  # file's comment. docker-compose.prod.yml pulls both.
  #
  # Publishes to this team's own registry (REGISTRY_URL) on the self-hosted
  # runner, using the REGISTRY_USERNAME/REGISTRY_PASSWORD repo secrets.
  #
  # Once both images are pushed, cuts a GitHub release tagged
  # cincel-app-vX.Y.Z, versioned from the Conventional Commits since the
  # previous one (.github/scripts/next-version.sh). The same version is baked
  # into the image (shown in the sidebar) and added as an image tag. Releases
  # are serialized so two quick merges can't compute the same version.
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency:
      group: cincel-app-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # Full history and tags: the version is computed from the commits
          # since the last cincel-app-v* tag.
          fetch-depth: 0

      # Fails with the name of the missing secret instead of docker/login-action's
      # opaque "Username and password required".
      - name: Check registry secrets
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        working-directory: .
        run: |
          missing=0
          for name in REGISTRY_URL REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing

      - name: Compute release version
        id: version
        working-directory: .
        run: |
          .github/scripts/next-version.sh cincel-app "$RUNNER_TEMP/release-notes.md" \
            .github/workflows/cincel-app-docker.yml .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"

      # Strips a trailing slash and an accidental http(s):// scheme from the
      # REGISTRY_URL secret before it's used to build an image reference --
      # `docker login` tolerates both, but `docker/build-push-action` doesn't:
      # a trailing slash produces a double slash in the tag ("host//cincel-app")
      # and fails with "invalid reference format".
      - name: Normalize registry URL
        id: registry
        run: |
          registry="${{ secrets.REGISTRY_URL }}"
          registry="${registry%/}"
          registry="${registry#http://}"
          registry="${registry#https://}"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      # Self-hosted: build with the host's Docker daemon so its local layer
      # cache is reused between runs (no GitHub cache upload/download).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Keter Console reads the runtime image's recipe from these labels
      # without pulling it. The digest hashes the exact file the image copies.
      - name: Compute Keter recipe labels
        id: kcd
        working-directory: .
        run: |
          echo "digest=sha256:$(sha256sum cincel-app/kcd.yml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "content=$(gzip -9n < cincel-app/kcd.yml | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: cincel-app
          file: cincel-app/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            KCD_DIGEST=${{ steps.kcd.outputs.digest }}
            KCD_CONTENT=${{ steps.kcd.outputs.content }}
          tags: |
            ${{ steps.registry.outputs.registry }}/cincel-app:${{ steps.version.outputs.version }}
            ${{ steps.registry.outputs.registry }}/cincel-app:${{ github.sha }}
            ${{ steps.registry.outputs.registry }}/cincel-app:latest

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: cincel-app
          file: cincel-app/Dockerfile
          target: build
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.registry.outputs.registry }}/cincel-app-migrate:${{ steps.version.outputs.version }}
            ${{ steps.registry.outputs.registry }}/cincel-app-migrate:${{ github.sha }}
            ${{ steps.registry.outputs.registry }}/cincel-app-migrate:latest

      # Only reached once both images are pushed. Skipped when nothing under
      # cincel-app/ (or this pipeline) changed since the last release.
      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: cincel-app v${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: true
