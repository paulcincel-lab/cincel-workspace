services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cincel}
      POSTGRES_USER: ${POSTGRES_USER:-cincel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cincel}
    ports:
      - "5432:5432"
    volumes:
      - cincel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cincel} -d ${POSTGRES_DB:-cincel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    deploy:
      resources:
        limits:
          memory: 1G
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Inside the compose network the database is reachable as `db`, overriding
      # whatever localhost-based DATABASE_URL is in .env for host tooling.
      DATABASE_URL: postgres://${POSTGRES_USER:-cincel}:${POSTGRES_PASSWORD:-cincel}@db:5432/${POSTGRES_DB:-cincel}
    depends_on:
      db:
        condition: service_healthy

volumes:
  cincel_db_data:
