services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cincel}
      POSTGRES_USER: ${POSTGRES_USER:-cincel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cincel}
    ports:
      - "5432:5432"
    volumes:
      - cincel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cincel} -d ${POSTGRES_DB:-cincel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies Drizzle migrations, then exits. `app` waits for this to
  # finish successfully, so `docker compose up` can never start the server
  # against an un-migrated database. Uses the Dockerfile `build` stage because
  # that layer still has drizzle-kit + the migration SQL (the runtime image
  # does not). Safe to re-run — drizzle tracks applied migrations.
  migrate:
    image: ${REGISTRY_URL}/cincel-app-migrate:${IMAGE_TAG}
    command: ["npm", "run", "db:migrate"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cincel}:${POSTGRES_PASSWORD:-cincel}@db:5432/${POSTGRES_DB:-cincel}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    deploy:
      resources:
        limits:
          memory: 1G
    image: ${REGISTRY_URL}/cincel-app:${IMAGE_TAG}
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Inside the compose network the database is reachable as `db`, overriding
      # whatever localhost-based DATABASE_URL is in .env for host tooling.
      DATABASE_URL: postgres://${POSTGRES_USER:-cincel}:${POSTGRES_PASSWORD:-cincel}@db:5432/${POSTGRES_DB:-cincel}
      # Local mail goes to Mailpit, never to Gmail, whatever SMTP_* is in .env.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Local only: catches every email the app sends (portal invitations, sign-in
  # links). Web UI at http://localhost:8025; SMTP on 1025 (no TLS, no auth).
  # A host `npm run dev` reaches it with SMTP_HOST=localhost SMTP_PORT=1025.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  cincel_db_data:
