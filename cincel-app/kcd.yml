name: "Cincel Workspace"
port: 3000
health: /api/healthz
env:
  ACCESS_RECHECK_HOURS: { default: "4", description: "Hours between Workspace access re-checks of a signed-in staff member." }
  APP_ORIGIN: { description: "Public origin of the app (e.g. https://app.example.com). Builds the staff Google sign-in redirect URI <APP_ORIGIN>/api/auth/google/callback; never taken from the request." }
  AUTH_GOOGLE_ENABLED: { default: "true", description: "Staff login flag (true/false): shows \"Entrar con Google\" and enables /api/auth/google/*. Read server-side." }
  AUTH_PASSWORD_ENABLED: { default: "true", description: "Staff login flag (true/false): shows the email/password form and enables login, first access and change password. Read server-side." }
  BOOTSTRAP_ADMIN_EMAIL: { description: "Optional. With BOOTSTRAP_ADMIN_PASSWORD, the migrate job creates or updates this staff member as Administrador with a password login on every deploy, so no seed is needed. Leave both empty to skip." }
  BOOTSTRAP_ADMIN_PASSWORD: { secret: true, description: "Password for BOOTSTRAP_ADMIN_EMAIL. The env value wins: change it here and redeploy to reset the password." }
  CINCEL_ADMIN_EMAILS: {}
  GITHUB_PAT: { description: "── GitHub RFCs (assistant `create_rfc` tool, optional) ───────────────────── Fine-grained personal access token scoped to Issues: write on GITHUB_REPO only (no other repo/org scope). Used to file RFCs the assistant drafts as GitHub Issues labeled \"rfc\". Leave unset to disable the tool — it tells the user GitHub isn't configured instead of failing silently." }
  GITHUB_REPO: {}
  GOOGLE_DRIVE_ROOT_FOLDER_ID: {}
  GOOGLE_OAUTH_CLIENT_ID: { description: "Staff OAuth client (Internal) from the company's Google Cloud project, used by \"Entrar con Google\" and by the Drive and Calendar consent each staff member grants. Register <APP_ORIGIN>/api/auth/google/callback as its redirect URI. Enable the Drive and Calendar APIs; see docs/google-drive.md." }
  GOOGLE_OAUTH_CLIENT_SECRET: { secret: true }
  GOOGLE_SA_CLIENT_EMAIL: { description: "Email of the cincel-directory service account, acting as itself. It reads Workspace users and groups for sign-in through a read-only admin role, and writes project folders as a Content manager of GOOGLE_SHARED_DRIVE_ID. See docs/google-drive.md." }
  GOOGLE_SA_PRIVATE_KEY: { secret: true }
  GOOGLE_SHARED_DRIVE_ID: { description: "Company Shared Drive where project folders live. The service account must be a Content manager on it. See docs/google-drive.md." }
  GOOGLE_WORKSPACE_CUSTOMER_ID: { description: "Optional Workspace customer id, for Directory groups.get." }
  GOOGLE_WORKSPACE_DOMAIN: { description: "Workspace domain allowed to sign in (checked against the ID token's hd)." }
  LLM_API_KEY: { secret: true }
  LLM_BASE_URL: { description: "── AI Assistant (Phase 5, optional) ──────────────────────────────────────── OpenAI-compatible chat endpoint for /asistente. Point LLM_BASE_URL at any compatible /v1 surface (OpenAI, a local model, a Claude proxy, …). Leave unset to disable — the route returns 503 and the UI shows an error." }
  LLM_MODEL: { default: "gpt-4o-mini" }
  MAIL_FROM: { description: "Sender of portal mail, e.g. \"Cincel <portal@cincel.mx>\". Must be SMTP_USER itself or one of its verified Gmail \"Send mail as\" aliases. Empty = \"Cincel <SMTP_USER>\"." }
  SMTP_HOST: { description: "Client portal mail (invitations, sign-in links): smtp.gmail.com, sending from one Workspace account. Empty = mail is only logged and nothing is delivered. Setup in docs/deployment.md." }
  SMTP_PASSWORD: { secret: true, description: "App password of the SMTP_USER Workspace account (Google Account > Security > App passwords; needs 2-Step Verification). See docs/deployment.md." }
  SMTP_PORT: { default: "465", description: "SMTP port: 465 for smtp.gmail.com (implicit TLS)." }
  SMTP_USER: { description: "The Workspace account that sends portal mail, e.g. portal@cincel.mx." }
  TOKEN_ENCRYPTION_KEY: { secret: true, generate: hex32, description: "AES-256 key for OAuth tokens at rest (32 bytes as 64 hex chars)." }
needs:
  postgres: { version: "17" }
stack:
  id: cincel-app
  name: "Cincel Workspace"
  service: app
  jobs:
    migrate: { command: "node scripts/migrate.mjs" }
