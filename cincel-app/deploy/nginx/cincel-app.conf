# Reverse proxy fronting the Cincel Workspace app container.
#
# Cincel Workspace is a single Next.js app (pages, server actions, and its own
# /api/* route handlers all live in the one process) — there is no separate
# backend service to route to, unlike a split frontend/API deployment. So this
# is one server block proxying everything to the `app` compose service on its
# published port. Adjust `server_name` and the upstream port
# (docker-compose.prod.yml / docker-compose.yml both default APP_PORT to 3000)
# to match your deployment.
#
# This is distinct from anything the app itself renders at runtime for its own
# domain data (there is none here — tramos, fases and their task templates
# live in the database).

upstream cincel_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    # Placeholder — the actual production hostname isn't recorded anywhere in
    # this repo. Replace before use.
    server_name workspace.example.com;

    # Redirect to HTTPS once a cert is provisioned (e.g. certbot). Remove this
    # block and terminate TLS elsewhere if this host sits behind another proxy
    # / load balancer that already handles it.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name workspace.example.com;

    # ssl_certificate     /etc/letsencrypt/live/workspace.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/workspace.example.com/privkey.pem;

    client_max_body_size 20m;

    # Client portal uploads (docs/specs/backend.md §B.4.7): files up to 50 MB plus multipart overhead. The body is
    # streamed to the app (no buffering to disk) and the app streams it on to Drive, so the timeouts are longer.
    # The Keter route in front of the app must accept >= 55 MB on this path too. Check it with a portal session
    # cookie and a project that user can see (Drive folders ready), using a real PDF just under 50 MB:
    #   { printf '%%PDF-1.4\n'; head -c 52000000 /dev/urandom; } > /tmp/50m.pdf
    #   curl -sS -w '\n%{http_code}\n' -b 'cincel_portal_session=<token>' -F file=@/tmp/50m.pdf \
    #     https://<host>/api/portal/projects/<pid>/uploads
    # Only a 201 proves the body got through, because the app reads all of it first (delete the test file from the
    # project's "03 Del cliente" folder afterwards). A 401/403/404 is answered before the body is read, and the app
    # rejects a larger body with a JSON 413 from its Content-Length check, so neither proves anything. An HTML 413
    # from the proxy means the Keter route still needs a higher limit.
    location ~ ^/api/portal/projects/[^/]+/uploads$ {
        client_max_body_size 55m;
        proxy_request_buffering off;

        proxy_pass http://cincel_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://cincel_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js server actions / streaming responses need Connection kept
        # open rather than nginx's default "close".
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
